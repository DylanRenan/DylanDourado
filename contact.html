<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contato - Dylan Dourado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="contact-page">

    <div id="header"></div>

    <main class="contact-main">

        <section class="contact-section">

            <div class="contact-info reveal">
                <h1>Entre em contato</h1>
                <p>Se quiser falar sobre projetos, oportunidades ou ideias, me mande uma mensagem.</p>
                <div class="contact-details">
                    <p><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/dylan-ferreira-dourado/" target="_blank" rel="noopener noreferrer">Dylan Dourado</a></p>
                    <p><strong>Instagram:</strong> <a href="https://www.instagram.com/dylandourado/" target="_blank" rel="noopener noreferrer">@dylandourado</a></p>
                </div>
            </div>

            <div class="contact-form reveal">

                <form id="contact-form">

                    <input type="hidden" name="_captcha" value="false">

                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" name="name" placeholder="Seu nome" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="Seu email" required>
                    </div>

                    <div class="form-group">
                        <label>Mensagem</label>
                        <textarea name="message" placeholder="Sua mensagem" required></textarea>
                    </div>

                    <button type="submit">Enviar mensagem</button>

                </form>

            </div>

        </section>

    </main>

    <div id="footer"></div>

    <script src="script.js"></script>
    <script>
        document.getElementById("contact-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btn = this.querySelector("button");
            const originalText = btn.textContent;
            btn.textContent = "Enviando...";
            btn.disabled = true;

            try {
                const response = await fetch("https://formsubmit.co/ajax/renandylan@gmail.com", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(Object.fromEntries(new FormData(this)))
                });

                if (response.ok) {
                    window.location.href = "obrigado.html";
                } else {
                    throw new Error("Falha no envio");
                }
            } catch (err) {
                btn.textContent = originalText;
                btn.disabled = false;
                alert("Erro ao enviar. Tente novamente.");
            }
        });
    </script>

</body>
</html>
